<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colosseum Fighter Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#0d0808',
            'night-lighter': '#1a1010',
            'night-card': '#1e1215',
            'night-border': '#3a2222',
            gold: '#c41e3a',
            'gold-dark': '#8b0000',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { background: #0d0808; color: #e5e5e5; font-family: 'Cinzel', serif; }
    .roman-divider { height: 2px; background: linear-gradient(90deg, transparent, #c41e3a, transparent); margin: 1rem 0; }
    input, select { background: #1a1010; border: 1px solid #3a2222; color: white; }
    input:focus, select:focus { outline: none; border-color: #c41e3a; }
    button { font-family: 'Cinzel', serif; }
    .stat-row { display: grid; grid-template-columns: 40px 1fr 60px 40px; align-items: center; gap: 0.5rem; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-black text-gold tracking-wider">
        <span>🏛️</span> FIGHTER BUILDER <span>🏛️</span>
      </h1>
      <p class="text-gray-400 mt-2 text-sm font-sans">Forge a custom champion and import into Colosseum Arena</p>
      <div class="roman-divider"></div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Left panel: identity and class -->
      <section class="bg-night-card border border-night-border rounded-2xl p-6 shadow-xl">
        <h2 class="text-xl font-bold text-gold mb-4 border-b border-night-border pb-2">Identity</h2>

        <div class="mb-4">
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Name</label>
          <input id="fighterName" type="text" maxlength="20" placeholder="Champion name..." class="w-full rounded-lg px-3 py-2" />
        </div>

        <div class="mb-4">
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Class</label>
          <select id="fighterClass" class="w-full rounded-lg px-3 py-2"></select>
        </div>

        <div class="mb-4">
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Avatar URL or Upload</label>
          <div class="flex gap-2">
            <input id="fighterAvatar" type="text" placeholder="Image URL..." class="flex-1 rounded-lg px-3 py-2" />
            <label class="cursor-pointer bg-night-lighter border border-night-border text-gray-400 rounded-lg px-3 py-2 text-xs hover:text-gold transition-colors flex items-center">
              📷
              <input id="avatarUpload" type="file" accept="image/*" class="hidden" />
            </label>
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Level</label>
          <input id="fighterLevel" type="number" min="1" max="50" value="1" class="w-full rounded-lg px-3 py-2" />
        </div>

        <div class="flex gap-4 text-center">
          <div class="flex-1 bg-night-lighter border border-night-border rounded-lg p-3">
            <div class="text-xs text-gray-500 uppercase">Max HP</div>
            <div id="previewHp" class="text-xl font-bold text-red-400">0</div>
          </div>
          <div class="flex-1 bg-night-lighter border border-night-border rounded-lg p-3">
            <div class="text-xs text-gray-500 uppercase">Max MP</div>
            <div id="previewMp" class="text-xl font-bold text-blue-400">0</div>
          </div>
        </div>
      </section>

      <!-- Right panel: stats -->
      <section class="bg-night-card border border-night-border rounded-2xl p-6 shadow-xl">
        <div class="flex justify-between items-center mb-4 border-b border-night-border pb-2">
          <h2 class="text-xl font-bold text-gold">Base Stats</h2>
          <div class="text-sm">
            <span class="text-gray-400">Points:</span>
            <span id="pointsLeft" class="font-bold text-gold">60</span>
          </div>
        </div>

        <div id="statRows" class="space-y-3"></div>

        <div class="mt-6 p-3 bg-night-lighter border border-night-border rounded-lg text-center">
          <div class="text-xs text-gray-500 uppercase mb-1">Stat Total</div>
          <div id="statTotal" class="text-2xl font-bold text-white">0 / 60</div>
        </div>

        <button id="autoAssign" class="mt-4 w-full py-2 rounded-lg border border-night-border bg-night-lighter text-gray-400 hover:text-gold hover:border-gold transition-colors text-sm">
          🎲 Auto-Distribute Stats
        </button>
      </section>
    </main>

    <section class="mt-8 bg-night-card border border-night-border rounded-2xl p-6 shadow-xl">
      <h2 class="text-xl font-bold text-gold mb-4 border-b border-night-border pb-2">Import / Export</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button id="saveToGame" class="py-4 rounded-xl bg-gradient-to-r from-gold-dark to-gold text-white font-bold uppercase tracking-wider hover:shadow-lg hover:shadow-red-900/40 hover:scale-[1.02] transition-all">
          <span>⚔️</span> Send to Colosseum <span>⚔️</span>
        </button>
        <button id="copyJson" class="py-4 rounded-xl border-2 border-night-border bg-night-lighter text-gray-300 hover:text-white hover:border-gray-500 transition-all">
          📋 Copy Fighter JSON
        </button>
      </div>
      <div id="status" class="mt-3 text-center text-sm text-gold min-h-[1.25rem]"></div>
    </section>
  </div>

  <script>
    const CLASSES = [
      { id: 'none', name: 'No Class', baseStats: { strength: 0, agility: 0, vitality: 0, intellect: 0, luck: 0 }, color: '#9CA3AF' },
      { id: 'gladiator', name: 'Gladiator', baseStats: { strength: 18, agility: 10, vitality: 16, intellect: 5, luck: 8 }, },
      { id: 'shadow', name: 'Shadow Assassin', baseStats: { strength: 12, agility: 20, vitality: 8, intellect: 8, luck: 14 }, },
      { id: 'mage', name: 'Arcane Sorcerer', baseStats: { strength: 5, agility: 8, vitality: 10, intellect: 22, luck: 10 }, },
      { id: 'paladin', name: 'Holy Paladin', baseStats: { strength: 14, agility: 8, vitality: 18, intellect: 12, luck: 6 }, },
      { id: 'berserker', name: 'Berserker', baseStats: { strength: 22, agility: 12, vitality: 14, intellect: 3, luck: 10 }, },
      { id: 'ranger', name: 'Beast Ranger', baseStats: { strength: 10, agility: 18, vitality: 12, intellect: 10, luck: 12 }, },
      { id: 'necromancer', name: 'Necromancer', baseStats: { strength: 6, agility: 7, vitality: 12, intellect: 20, luck: 12 }, },
      { id: 'monk', name: 'War Monk', baseStats: { strength: 14, agility: 16, vitality: 14, intellect: 8, luck: 10 }, },
      { id: 'stormcaller', name: 'Storm Caller', baseStats: { strength: 8, agility: 16, vitality: 10, intellect: 20, luck: 10 }, },
      { id: 'warden', name: 'Warden', baseStats: { strength: 16, agility: 8, vitality: 20, intellect: 10, luck: 6 }, },
      { id: 'runeknight', name: 'Rune Knight', baseStats: { strength: 14, agility: 12, vitality: 14, intellect: 14, luck: 10 }, },
    ];

    const STAT_KEYS = [
      { key: 'strength', label: 'STR', color: '#ef4444' },
      { key: 'agility', label: 'AGI', color: '#22c55e' },
      { key: 'vitality', label: 'VIT', color: '#eab308' },
      { key: 'intellect', label: 'INT', color: '#3b82f6' },
      { key: 'luck', label: 'LCK', color: '#a855f7' },
    ];

    const MAX_POINTS = 60;
    const MIN_STAT = 3;
    const MAX_STAT = 25;

    let stats = { strength: 12, agility: 12, vitality: 12, intellect: 12, luck: 12 };
    let avatarUrl = '';

    const els = {
      name: document.getElementById('fighterName'),
      classSelect: document.getElementById('fighterClass'),
      avatar: document.getElementById('fighterAvatar'),
      avatarUpload: document.getElementById('avatarUpload'),
      level: document.getElementById('fighterLevel'),
      statRows: document.getElementById('statRows'),
      pointsLeft: document.getElementById('pointsLeft'),
      statTotal: document.getElementById('statTotal'),
      previewHp: document.getElementById('previewHp'),
      previewMp: document.getElementById('previewMp'),
      autoAssign: document.getElementById('autoAssign'),
      saveToGame: document.getElementById('saveToGame'),
      copyJson: document.getElementById('copyJson'),
      status: document.getElementById('status'),
    };

    function renderClassOptions() {
      els.classSelect.innerHTML = CLASSES.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function getBaseStats() {
      const cls = CLASSES.find((c) => c.id === els.classSelect.value);
      return cls ? { ...cls.baseStats } : { strength: 0, agility: 0, vitality: 0, intellect: 0, luck: 0 };
    }

    function totalSpent() {
      return Object.values(stats).reduce((a, b) => a + b, 0);
    }

    function pointsLeft() {
      return MAX_POINTS - totalSpent();
    }

    function updatePreviews() {
      const base = getBaseStats();
      const finalStats = {};
      STAT_KEYS.forEach(({ key }) => {
        finalStats[key] = Math.max(MIN_STAT, (base[key] || 0) + stats[key]);
      });
      const maxHp = 80 + finalStats.vitality * 12 + finalStats.strength * 3;
      const maxMp = 30 + finalStats.intellect * 8;
      els.previewHp.textContent = maxHp;
      els.previewMp.textContent = maxMp;
      els.pointsLeft.textContent = pointsLeft();
      els.statTotal.textContent = `${totalSpent()} / ${MAX_POINTS}`;
    }

    function renderStatRows() {
      els.statRows.innerHTML = '';
      STAT_KEYS.forEach(({ key, label, color }) => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <span class="font-bold text-sm" style="color:${color}">${label}</span>
          <input type="range" min="${MIN_STAT}" max="${MAX_STAT}" value="${stats[key]}" data-key="${key}" class="w-full accent-red-600" />
          <input type="number" min="${MIN_STAT}" max="${MAX_STAT}" value="${stats[key]}" data-key="${key}" class="rounded px-2 py-1 text-center" />
          <button data-key="${key}" class="reset-stat text-gray-500 hover:text-gold text-lg" title="Reset to 12">↺</button>
        `;
        els.statRows.appendChild(row);
      });

      els.statRows.querySelectorAll('input[data-key]').forEach((input) => {
        input.addEventListener('input', (e) => {
          const key = e.target.dataset.key;
          let val = Math.max(MIN_STAT, Math.min(MAX_STAT, Number(e.target.value)));
          const old = stats[key];
          const delta = val - old;
          if (delta > 0 && pointsLeft() < delta) {
            val = old + pointsLeft();
          }
          stats[key] = val;
          syncStatInputs();
          updatePreviews();
        });
      });

      els.statRows.querySelectorAll('.reset-stat').forEach((btn) => {
        btn.addEventListener('click', () => {
          stats[btn.dataset.key] = 12;
          syncStatInputs();
          updatePreviews();
        });
      });
    }

    function syncStatInputs() {
      els.statRows.querySelectorAll('input[data-key]').forEach((input) => {
        input.value = stats[input.dataset.key];
      });
    }

    function autoAssignStats() {
      const base = getBaseStats();
      const pool = MAX_POINTS;
      const minPer = MIN_STAT * 5;
      let remaining = pool - minPer;
      let raw = { strength: 0, agility: 0, vitality: 0, intellect: 0, luck: 0 };

      // Weight by class strengths
      const weights = {};
      STAT_KEYS.forEach(({ key }) => { weights[key] = Math.max(1, base[key] || 8); });
      const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);

      STAT_KEYS.forEach(({ key }) => {
        const share = Math.floor((weights[key] / totalWeight) * remaining);
        raw[key] = share;
      });

      // Distribute remainder
     STAT_KEYS.forEach(({ key }) => {
        const share = Math.floor((weights[key] / totalWeight) * remaining);
        raw[key] = share;
      });

      let distributed = 0;
      STAT_KEYS.forEach(({ key }) => { distributed += raw[key]; });
      remaining = pool - distributed - minPer;

      // Add leftover to highest weight stat
      while (remaining > 0) {
        const key = STAT_KEYS.reduce((a, b) => raw[a.key] / weights[a.key] < raw[b.key] / weights[b.key] ? a : b).key;
        if (raw[key] + MIN_STAT < MAX_STAT) { raw[key]++; remaining--; } else { break; } // prevent infinite if maxed
        remaining--;
      }

      stats = {};
      STAT_KEYS.forEach(({ key }) => { stats[key] = Math.min(MAX_STAT, Math.max(MIN_STAT, raw[key] + MIN_STAT)); });
      syncStatInputs();
      updatePreviews();
    }

    function buildFighterData() {
      const base = getBaseStats();
      const finalStats = {};
      STAT_KEYS.forEach(({ key }) => { finalStats[key] = Math.max(MIN_STAT, (base[key] || 0) + stats[key]); });
      const maxHp = 80 + finalStats.vitality * 12 + finalStats.strength * 3;
      const maxMp = 30 + finalStats.intellect * 8;
      return {
        name: els.name.value.trim() || 'Unnamed Fighter',
        classId: els.classSelect.value,
        stats: finalStats,
        maxHp,
        currentHp: maxHp,
        maxMp,
        currentMp: maxMp,
        variables: {},
        avatar: avatarUrl || undefined,
      };
    }

    function showStatus(msg) {
      els.status.textContent = msg;
      setTimeout(() => { els.status.textContent = ''; }, 3000);
    }

    els.classSelect.addEventListener('change', () => {
      autoAssignStats();
    });

    els.avatar.addEventListener('input', (e) => { avatarUrl = e.target.value; });

    els.avatarUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 500_000) { showStatus('Image too large (max 500KB)'); return; }
      const reader = new FileReader();
      reader.onload = () => { avatarUrl = reader.result; els.avatar.value = '(uploaded)'; };
      reader.readAsDataURL(file);
    });

    els.autoAssign.addEventListener('click', autoAssignStats);

    els.saveToGame.addEventListener('click', () => {
      const data = buildFighterData();
      localStorage.setItem('colosseum-builder-fighter', JSON.stringify(data));
      showStatus(`Sent ${data.name} to Colosseum. Return to the main app and click Import.`);
    });

    els.copyJson.addEventListener('click', () => {
      const data = buildFighterData();
      navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => showStatus('Fighter JSON copied!'));
    });

    renderClassOptions();
    renderStatRows();
    autoAssignStats();
  </script>
</body>
</html>
